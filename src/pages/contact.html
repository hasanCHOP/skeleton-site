<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="../css/styles.css" />
	</head>
	<body>
		<header class="main-header">
			<!-- HAMBURGER ICON -->
			<div class="hamburger" id="hamburger">
				<span></span>
				<span></span>
				<span></span>
			</div>
			<!-- BRAND LOGO -->
			<div class="logo">
				<a href="#">
					<img src="../assets/logo.svg" alt="MyWebsite" width="140" height="40" />
				</a>
			</div>
			<!-- NAVIGATION LINKS -->
			<nav class="nav-links">
				<ul>
					<li><a href="/">Home</a></li>
					<li><a href="services.html">Services</a></li>
					<li><a href="products.html">Products</a></li>
					<li><a href="gallery.html">Gallery</a></li>
					<li><a href="blog.html">Blog</a></li>
					<li><a href="about.html">About</a></li>
					<li><a href="contact.html">Contact</a></li>
				</ul>
			</nav>
			<!-- SEARCH AND ACCOUNT ICONS -->
			<div class="account-icons">
				<ul>
					<li>
						<a href="#">
							<svg aria-hidden="true"><use href="../assets/icons.svg#search"></use></svg><span class="visually-hidden">Search</span>
						</a>
					</li>
					<li>
						<a href="#">
							<svg aria-hidden="true"><use href="../assets/icons.svg#user"></use></svg><span class="visually-hidden">Account</span>
						</a>
					</li>
					<li>
						<a href="#">
							<svg aria-hidden="true"><use href="../assets/icons.svg#bag"></use></svg><span class="visually-hidden">Shopping bag</span>
						</a>
					</li>
				</ul>
			</div>
		</header>

		<!-- MOBILE NAVIGATION -->
		<nav class="mobile-nav" id="mobile-nav">
			<ul>
				<li><a href="/">Home</a></li>
				<li><a href="services.html">Services</a></li>
				<li><a href="products.html">Products</a></li>
				<li><a href="gallery.html">Gallery</a></li>
				<li><a href="blog.html">Blog</a></li>
				<li><a href="about.html">About</a></li>
				<li><a href="contact.html">Contact</a></li>
			</ul>
		</nav>
		<main>
			<section class="contact-form">
				<form id="contactForm" name="contact" method="POST" data-netlify="true">
					<input type="hidden" name="form-name" value="contact" />
					<label for="name">Name</label>
					<input type="text" id="name" name="name" required />

					<label for="email">Email</label>
					<input type="email" id="email" name="email" required />

					<label for="message">Message</label>
					<textarea id="message" name="message" rows="5" required></textarea>

					<button type="submit">Send Message</button>
				</form>
				<div id="formFeedback" class="hidden"></div>
			</section>
		</main>

		<footer class="main-footer">
			<p>&copy; 2024 MyWebsite. All Rights Reserved.</p>
		</footer>
		<script src="../js/app.js" defer></script>
	</body>
</html>
